<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수행평가 점수 확인</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
  .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  input, button, select { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
  button { background: #007bff; color: white; cursor: pointer; border: none; }
  button:hover { background: #0056b3; }
  .hidden { display: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
  th { background: #f8f9fa; }
  td input { width: 90%; padding: 5px; margin: 0; box-sizing: border-box; }
  .success-msg { color: #28a745; font-weight: bold; margin-top: 10px; display: none; }
  .loading { color: #007bff; font-weight: bold; margin-top: 10px; display: none; }
  @media (max-width: 600px) { table { font-size: 12px; } td input { font-size: 12px; } }
</style>
</head>
<body>

<div class="container" id="mainMenu">
  <h2>수행평가 점수 확인 시스템</h2>
  <button onclick="showSection('studentLogin')">학생용 모드</button>
  <button onclick="showSection('teacherLogin')" style="background:#6c757d;">교사용 모드</button>
</div>

<!-- 학생 로그인 -->
<div class="container hidden" id="studentLogin">
  <h2>학생 로그인</h2>
  <input type="text" id="studentId" placeholder="학번 (예: 30101)"><br>
  <input type="password" id="studentPw" placeholder="비밀번호 (초기: 1234)"><br>
  <button onclick="studentLogin()">로그인</button>
  <button onclick="showSection('mainMenu')" style="background:#6c757d;">뒤로</button>
  <div id="studentLoading" class="loading">⏳ 점수 데이터를 불러오는 중입니다...</div>
</div>

<!-- 학생 점수 조회 -->
<div class="container hidden" id="studentView">
  <h2>내 점수 확인</h2>
  <p id="studentInfo" style="font-weight: bold; font-size: 18px;"></p>
  <table>
    <thead>
      <tr><th>수행평가명</th><th>내 점수</th><th>반 평균</th><th>학년 평균</th><th>피드백</th></tr>
    </thead>
    <tbody id="studentScoreBody"></tbody>
  </table>
  <br>
  <button onclick="showSection('mainMenu')">로그아웃</button>
</div>

<!-- 교사 로그인 -->
<div class="container hidden" id="teacherLogin">
  <h2>교사 로그인</h2>
  <input type="password" id="teacherPw" placeholder="교사 비밀번호 (기본: 1234)"><br>
  <button onclick="teacherLogin()">로그인</button>
  <button onclick="showSection('mainMenu')" style="background:#6c757d;">뒤로</button>
</div>

<!-- 교사 관리 페이지 -->
<div class="container hidden" id="teacherView">
  <h2>교사용 점수 입력</h2>
  
  <div style="text-align: left; background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 15px;">
    <strong>1. 학년 및 반 선택 (필수)</strong><br>
    <select id="gradeSelect" onchange="loadGradeSettings()">
      <option value="2">2학년</option>
      <option value="3" selected>3학년</option>
    </select>
    <input type="number" id="classSelect" placeholder="반 입력 (예: 1)" style="width: 120px;"> 반
    
    <hr style="border: 0.5px solid #ccc; margin: 15px 0;">
    
    <strong>2. 수행평가 이름 설정</strong><br>
    <input type="text" id="sub1_name">
    <input type="text" id="sub2_name">
    <input type="text" id="sub3_name">
  </div>

  <p style="font-size: 14px; color: #555;">💡 엑셀에서 [번호, 이름, 점수1, 점수2, 점수3, 피드백] 영역을 복사한 뒤, 1번 학생의 번호 칸을 클릭하고 <b>Ctrl+V</b>를 누르세요.</p>
  
  <div style="overflow-x: auto;">
    <table id="scoreTable">
      <thead>
        <tr>
          <th>번호</th><th>이름</th>
          <th id="th_sub1">수행1</th><th id="th_sub2">수행2</th><th id="th_sub3">수행3</th>
          <th>피드백</th>
        </tr>
      </thead>
      <tbody id="teacherTableBody">
        <!-- 35명 행 생성됨 -->
      </tbody>
    </table>
  </div>
  
  <button onclick="saveData()" style="width: 100%; margin-top: 15px; font-size: 18px; padding: 15px;">서버에 일괄 저장하기</button>
  <div id="saveLoading" class="loading">⏳ 구글 스프레드시트에 저장 중입니다... (최대 10초 소요)</div>
  <div class="success-msg" id="saveSuccess">✅ 완료 (데이터가 일괄 저장되었습니다)</div>
  <br><button onclick="showSection('mainMenu')" style="background:#6c757d; margin-top:10px;">로그아웃</button>
</div>

<script>
  // ★★★ 여기에 2단계에서 복사한 웹 앱 URL을 붙여넣으세요! ★★★
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwRgd4FwwKuReGCQTYFIp-KVztWcfyv1fzvL3Z4Jr6dh1HMxDSZ5uNvpc8srb5IzBCq/exec";

  const defaultSubjects = {
    "2": ["산업혁명", "제자백가", "포트폴리오"],
    "3": ["가상 토론", "노래 제작", "카드뉴스 제작"]
  };

  function showSection(id) {
    document.querySelectorAll('.container').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.getElementById('saveSuccess').style.display = 'none';
    document.getElementById('studentId').value = '';
    document.getElementById('studentPw').value = '';
  }

  function teacherLogin() {
    if (document.getElementById('teacherPw').value === '1234') {
      document.getElementById('teacherPw').value = '';
      showSection('teacherView');
      loadGradeSettings();
      generateTeacherTable();
    } else {
      alert('비밀번호가 틀렸습니다.');
    }
  }

  function loadGradeSettings() {
    const grade = document.getElementById('gradeSelect').value;
    document.getElementById('sub1_name').value = defaultSubjects[grade][0];
    document.getElementById('sub2_name').value = defaultSubjects[grade][1];
    document.getElementById('sub3_name').value = defaultSubjects[grade][2];
    
    const updateHeaders = () => {
      document.getElementById('th_sub1').innerText = document.getElementById('sub1_name').value;
      document.getElementById('th_sub2').innerText = document.getElementById('sub2_name').value;
      document.getElementById('th_sub3').innerText = document.getElementById('sub3_name').value;
    };
    
    document.getElementById('sub1_name').oninput = updateHeaders;
    document.getElementById('sub2_name').oninput = updateHeaders;
    document.getElementById('sub3_name').oninput = updateHeaders;
    updateHeaders();
  }

  function generateTeacherTable() {
    const tbody = document.getElementById('teacherTableBody');
    tbody.innerHTML = '';
    for (let i = 1; i <= 35; i++) {
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" value="${i}" class="col-0"></td>
        <td><input type="text" class="col-1"></td>
        <td><input type="number" class="col-2"></td>
        <td><input type="number" class="col-3"></td>
        <td><input type="number" class="col-4"></td>
        <td><input type="text" class="col-5"></td>
      `;
      tbody.appendChild(tr);
    }
    
    // 엑셀 붙여넣기 기능
    tbody.addEventListener('paste', function(e) {
      e.preventDefault();
      const paste = (e.clipboardData || window.clipboardData).getData('text');
      const rows = paste.split('\n');
      const targetElement = e.target;
      const startRowIndex = targetElement.closest('tr').rowIndex - 1; 
      const startColIndex = parseInt(targetElement.className.replace('col-', ''));

      rows.forEach((row, rIdx) => {
        if (!row.trim()) return;
        const cols = row.split('\t');
        const tr = tbody.rows[startRowIndex + rIdx];
        if (tr) {
          cols.forEach((colData, cIdx) => {
            const input = tr.querySelector(`.col-${startColIndex + cIdx}`);
            if (input) input.value = colData.trim();
          });
        }
      });
    });
  }

  // 서버로 데이터 전송 (저장)
  function saveData() {
    if (WEB_APP_URL === "여기에_복사한_주소를_붙여넣으세요") {
      alert("코드 안에 웹 앱 URL이 입력되지 않았습니다."); return;
    }

    const grade = document.getElementById('gradeSelect').value;
    const ban = document.getElementById('classSelect').value;
    if (!ban) { alert('몇 반인지 입력해주세요!'); return; }

    const subjects = [
      document.getElementById('sub1_name').value,
      document.getElementById('sub2_name').value,
      document.getElementById('sub3_name').value
    ];

    const tbody = document.getElementById('teacherTableBody');
    const students = [];
    
    for (let i = 0; i < tbody.rows.length; i++) {
      const inputs = tbody.rows[i].querySelectorAll('input');
      if (inputs[1].value.trim() !== '') {
        students.push({
          num: inputs[0].value,
          name: inputs[1].value,
          score1: inputs[2].value,
          score2: inputs[3].value,
          score3: inputs[4].value,
          feedback: inputs[5].value
        });
      }
    }

    const payload = { grade: grade, ban: ban, subjects: subjects, students: students };

    document.getElementById('saveLoading').style.display = 'block';
    
    fetch(WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
      document.getElementById('saveLoading').style.display = 'none';
      if(data.result === 'success') {
        document.getElementById('saveSuccess').style.display = 'block';
        setTimeout(() => { document.getElementById('saveSuccess').style.display = 'none'; }, 4000);
      }
    })
    .catch(error => {
      document.getElementById('saveLoading').style.display = 'none';
      alert('저장 중 오류가 발생했습니다. URL을 확인해주세요.');
    });
  }

  // 학생 데이터 불러오기 (로그인)
  function studentLogin() {
    const id = document.getElementById('studentId').value;
    const pw = document.getElementById('studentPw').value;
    
    if (!id || !pw) { alert('학번과 비밀번호를 모두 입력해주세요.'); return; }
    
    document.getElementById('studentLoading').style.display = 'block';

    fetch(WEB_APP_URL + `?hakbun=${id}&pw=${pw}`)
      .then(response => response.json())
      .then(data => {
        document.getElementById('studentLoading').style.display = 'none';
        
        if (data.success) {
          showSection('studentView');
          const st = data.student;
          document.getElementById('studentInfo').innerText = `${id} ${st.name} 학생, 환영합니다.`;
          
          const tbody = document.getElementById('studentScoreBody');
          tbody.innerHTML = `
            <tr><td>${st.sub1}</td><td>${st.score1}</td><td>${data.banAvg[0]}</td><td>${data.gradeAvg[0]}</td><td>${st.feedback}</td></tr>
            <tr><td>${st.sub2}</td><td>${st.score2}</td><td>${data.banAvg[1]}</td><td>${data.gradeAvg[1]}</td><td></td></tr>
            <tr><td>${st.sub3}</td><td>${st.score3}</td><td>${data.banAvg[2]}</td><td>${data.gradeAvg[2]}</td><td></td></tr>
          `;
        } else {
          alert(data.msg);
        }
      })
      .catch(error => {
        document.getElementById('studentLoading').style.display = 'none';
        alert('데이터를 불러오지 못했습니다. 선생님께 문의하세요.');
      });
  }
</script>
</body>
</html>
